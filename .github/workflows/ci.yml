name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npm run check-results
      - run: docker compose --profile test up --build --abort-on-container-exit --exit-code-from e2e e2e
      - if: always()
        run: docker compose --profile test down -v
