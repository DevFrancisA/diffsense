services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: diffsense
      POSTGRES_USER: diffsense
      POSTGRES_PASSWORD: diffsense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diffsense -d diffsense"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    environment:
      DATABASE_URL: postgres://diffsense:diffsense@postgres:5432/diffsense
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      NODE_ENV: production
    ports:
      - "${DIFFSENSE_PORT:-3000}:3000"
    networks:
      default:
        aliases:
          - diffsense-web
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: [test]
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      CI: "1"
      PLAYWRIGHT_BASE_URL: http://diffsense-web:3000
    command: ["sh", "-c", "npm ci && npm run test:e2e"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
